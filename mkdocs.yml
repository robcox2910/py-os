site_name: PyOS
site_url: https://robcox2910.github.io/py-os/
site_description: "Build your own operating system in Python: processes, CPU schedulers, virtual memory, a journaled filesystem and networking, explained for learners."
repo_url: https://github.com/robcox2910/py-os
repo_name: robcox2910/py-os

# theme:start
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
# theme:end

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - tables

nav:
  - Home: index.md
  - Shell Reference: shell-reference.md
  - Architecture: architecture.md
  - Visual Guide: diagrams.md
  - Concepts:
      - What Is an OS?: concepts/what-is-an-os.md
      - Processes: concepts/processes.md
      - Memory: concepts/memory.md
      - Filesystem: concepts/filesystem.md
      - The Kernel: concepts/kernel-and-syscalls.md
      - The Shell: concepts/shell.md
      - Devices and Networking: concepts/devices-and-networking.md
      - Users and Safety: concepts/users-and-safety.md
      - Interrupts and Timers: concepts/interrupts.md
      - "TCP: Reliable Delivery": concepts/tcp.md
      - Synchronization: concepts/synchronization.md
      - The Boot Chain: concepts/bootloader.md
      - Interactive Tutorials: concepts/tutorials.md
      - Framebuffer: concepts/framebuffer.md
      - TUI Dashboard: concepts/tui.md
      - Web UI: concepts/web-ui.md
      - Permissions: concepts/permissions.md
      - Binary Loader: concepts/binary-loader.md
      - Containers: concepts/containers.md
      - Inter-Machine Networking: concepts/inter-machine-networking.md
  - Property Testing: property-testing.md
  # series-nav:start
  - The series:
      - Series home: https://robcox2910.github.io/
      - "[You are here] PyOS": https://robcox2910.github.io/py-os/
      - Pebble: https://robcox2910.github.io/pebble-lang/
      - PyDB: https://robcox2910.github.io/pydb/
      - PyKV: https://robcox2910.github.io/pykv/
      - PyDocDB: https://robcox2910.github.io/pydoc-db/
      - PyGraphDB: https://robcox2910.github.io/pygraphdb/
      - PyTSDB: https://robcox2910.github.io/pytsdb/
      - PyVecDB: https://robcox2910.github.io/pyvecdb/
      - PyColDB: https://robcox2910.github.io/pycoldb/
      - PyCrypt: https://robcox2910.github.io/pycrypt/
      - PyNet: https://robcox2910.github.io/pynet/
      - PyWeb: https://robcox2910.github.io/pyweb/
      - PyGit: https://robcox2910.github.io/pygit/
      - PySearch: https://robcox2910.github.io/pysearch/
      - PyMQ: https://robcox2910.github.io/pymq/
      - PyLLM: https://robcox2910.github.io/pyllm/
      - PyStack: https://robcox2910.github.io/pystack/
  # series-nav:end

exclude_docs: |
  superpowers/
